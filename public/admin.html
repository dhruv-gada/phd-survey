<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Let us work together</title>
<link rel="stylesheet" href="/static/base.css">
<style>
  /* Sign-in */
  .signin { max-width: 440px; margin: 0 auto; padding: 56px 20px; }
  .signin h1 { font-size: 28px; margin: 0 0 6px; }
  .muted { color: var(--ink-2); }
  label.f { display: block; font-weight: 600; font-size: 15px; margin: 16px 0 6px; }
  input.f { width: 100%; padding: 12px 14px; font: inherit; color: var(--ink); background: var(--paper); border: 1.5px solid var(--rule); border-radius: 8px; }
  input.f:focus { outline: none; border-color: var(--teal); }
  .signin button { width: 100%; min-height: 50px; margin-top: 22px; border: 0; border-radius: 8px; background: var(--ink); color: #fff; font-weight: 650; font-size: 16px; cursor: pointer; }
  .err { color: var(--brick); font-weight: 550; margin: 10px 0 0; }

  /* Presenter view: the projector page fills the tab, so this tab is safe to share. */
  .stage { position: fixed; inset: 0; background: var(--paper); }
  .stage iframe { width: 100%; height: 100%; border: 0; display: block; pointer-events: none; }

  /* Controls fade out when the mouse is still, so they don't sit on the shared screen. */
  .controls { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); display: flex; gap: 6px; align-items: center;
    background: var(--ink); color: #fff; padding: 8px; border-radius: 12px; box-shadow: 0 6px 24px rgba(15, 42, 46, 0.25);
    transition: opacity 0.25s, transform 0.25s; z-index: 5; }
  body.idle .controls { opacity: 0; transform: translate(-50%, 12px); pointer-events: none; }
  body.idle { cursor: none; }
  .controls button, .controls a { min-height: 44px; padding: 0 16px; border-radius: 8px; border: 0; background: transparent; color: #fff;
    font: inherit; font-weight: 600; font-size: 15px; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; white-space: nowrap; }
  .controls button:hover, .controls a:hover { background: #1f3d42; }
  .controls .next { background: var(--marigold); color: var(--ink); padding: 0 20px; }
  .controls .next:hover { background: #f5c24d; }
  .controls button:disabled { opacity: 0.4; cursor: default; background: transparent; }
  .controls .sep { width: 1px; align-self: stretch; background: #345054; margin: 6px 2px; }
  @media (hover: none) { body.idle .controls { opacity: 1; transform: translateX(-50%); pointer-events: auto; } }
  @media (max-width: 640px) { .controls .wide-only { display: none; } }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<section class="signin" id="login" hidden>
  <h1>Survey admin</h1>
  <p class="muted">Sign in before you share your screen.</p>
  <form id="loginForm">
    <label class="f" for="u">Username</label>
    <input class="f" id="u" type="email" autocomplete="username" required>
    <label class="f" for="p">Password</label>
    <input class="f" id="p" type="password" autocomplete="current-password" required>
    <button type="submit">Sign in</button>
    <p class="err" id="loginErr" role="alert"></p>
  </form>
</section>

<div id="presenter" hidden>
  <div class="stage"><iframe id="screen" title="Projector view" tabindex="-1"></iframe></div>
  <nav class="controls" aria-label="Presenter controls">
    <button type="button" id="back">Back</button>
    <button type="button" class="next" id="next">Start</button>
    <button type="button" id="qr">QR code</button>
    <span class="sep wide-only"></span>
    <button type="button" class="wide-only" id="full">Full screen</button>
    <a class="wide-only" href="/ad-reimagine-bme/responses" target="_blank" rel="noopener">Responses</a>
  </nav>
</div>

<script src="/questions.js"></script>
<script src="/static/shared.js"></script>
<script>
const base = "/ad-reimagine-bme";
const $ = (id) => document.getElementById(id);
let live = null, busy = false, started = false;

// Button labels follow where the room is.
function renderControls() {
  if (!live) return;
  const s = live.state, last = QUESTIONS.length - 1;
  $("next").textContent = s.summary ? "Done" : s.q < 0 ? "Start question 1" : s.q === last ? "Show all results" : "Next question";
  $("next").disabled = s.summary;
  $("back").disabled = s.q < 0 && !s.summary;
  $("qr").disabled = s.q < 0 && !s.summary;
}

async function go(to) {
  if (busy) return;
  busy = true;
  try {
    const r = await fetch(base + "/go", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ to }) });
    if (r.status === 403) return show();
    const j = await r.json();
    if (j.ok) { live = j; renderControls(); }
  } finally { busy = false; }
}

function toggleFull() {
  if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
  else document.documentElement.requestFullscreen().catch(() => {});
}

$("next").onclick = () => go("next");
$("back").onclick = () => go("back");
$("qr").onclick = () => go("waiting");
$("full").onclick = toggleFull;
document.addEventListener("fullscreenchange", () => ($("full").textContent = document.fullscreenElement ? "Exit full screen" : "Full screen"));

// Keys and clickers: Right / Space / Page Down = next, Left / Page Up = back, Q = QR code, F = full screen.
document.addEventListener("keydown", (e) => {
  if ($("presenter").hidden || e.metaKey || e.ctrlKey || e.altKey) return;
  if (["ArrowRight", "PageDown", " "].includes(e.key)) { e.preventDefault(); go("next"); }
  else if (["ArrowLeft", "PageUp"].includes(e.key)) { e.preventDefault(); go("back"); }
  else if (e.key === "q" || e.key === "Q") go("waiting");
  else if (e.key === "f" || e.key === "F") toggleFull();
});

// Hide the controls and cursor after 2.5 s without mouse movement.
// Keys and clickers never bring the controls back, so presenting with them shows nothing extra.
let idleTimer;
function sleepSoon() {
  clearTimeout(idleTimer);
  idleTimer = setTimeout(() => {
    if (document.querySelector(".controls:hover")) sleepSoon(); // still pointing at a button
    else document.body.classList.add("idle");
  }, 2500);
}
function wake() { document.body.classList.remove("idle"); sleepSoon(); }
["mousemove", "pointerdown"].forEach((ev) => document.addEventListener(ev, wake));

async function show() {
  let ok = false;
  try { ok = (await (await fetch(base + "/me", { cache: "no-store" })).json()).admin; } catch {}
  $("login").hidden = ok; $("presenter").hidden = !ok;
  if (!ok) { $("u").focus(); return; }
  if (!started) {
    started = true;
    $("screen").src = "/results";
    connectLive("screen", (d) => { live = d; renderControls(); });
    setInterval(() => fetch("/healthz").catch(() => {}), 4 * 60e3); // keeps the free host awake while presenting
  }
  wake();
}

$("loginForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const btn = e.target.querySelector("button"); btn.disabled = true; $("loginErr").textContent = "";
  try {
    const r = await fetch(base + "/login", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ username: $("u").value, password: $("p").value }) });
    const j = await r.json();
    if (!j.ok) throw new Error(j.error);
    $("p").value = ""; show();
  } catch (x) { $("loginErr").textContent = x.message || "Sign-in didn't go through. Check your connection."; }
  finally { btn.disabled = false; }
});
show();
</script>
</body>
</html>
