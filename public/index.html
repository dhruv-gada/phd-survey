<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#ffffff">
<title>Let us work together</title>
<link rel="stylesheet" href="/static/base.css">
<style>
  main { max-width: 560px; margin: 0 auto; padding: 18px 20px 130px; min-height: 100svh; }
  .top { position: sticky; top: 0; z-index: 2; background: var(--paper); padding: 14px 0 12px; margin: -18px 0 8px; }
  .step { color: var(--ink-2); font-size: 15px; margin: 0 0 8px; }
  h1 { font-size: 27px; line-height: 1.18; font-weight: 700; letter-spacing: -0.012em; margin: 6px 0 6px; font-variation-settings: "opsz" 48; }
  .hint { color: var(--ink-2); margin: 0 0 20px; font-size: 15px; }

  .opt { position: relative; display: flex; align-items: center; gap: 14px; padding: 14px 16px; margin-bottom: 8px; min-height: 54px;
    border: 1.5px solid var(--rule); border-radius: 8px; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  .opt input { position: absolute; opacity: 0; pointer-events: none; }
  .mark { flex: 0 0 22px; height: 22px; border: 2px solid var(--ink-2); display: grid; place-items: center; background: var(--paper); }
  .single .mark { border-radius: 50%; }
  .multi .mark { border-radius: 4px; }
  .opt:has(input:checked) { border-color: var(--teal); background: var(--teal-soft); }
  .opt:has(input:checked) .mark { border-color: var(--teal); background: var(--teal); }
  .single .opt:has(input:checked) .mark::after { content: ""; width: 8px; height: 8px; border-radius: 50%; background: #fff; }
  .multi .opt:has(input:checked) .mark::after { content: ""; width: 6px; height: 11px; border: solid #fff; border-width: 0 2.5px 2.5px 0; transform: translateY(-1px) rotate(45deg); }
  .opt:has(input:focus-visible) { outline: 3px solid var(--focus); outline-offset: 2px; }
  .other { width: 100%; margin: 0 0 8px; padding: 13px 16px; font: inherit; border: 1.5px solid var(--rule); border-radius: 8px; background: var(--wash); color: var(--ink); }
  .other:focus { outline: none; border-color: var(--teal); background: var(--paper); }

  .mrow { margin-bottom: 18px; }
  .mrow > div:first-child { font-weight: 600; margin-bottom: 8px; }
  .seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .seg label { position: relative; display: grid; place-items: center; min-height: 50px; border: 1.5px solid var(--rule); border-radius: 8px; cursor: pointer; font-weight: 500; -webkit-tap-highlight-color: transparent; }
  .seg input { position: absolute; opacity: 0; pointer-events: none; }
  .seg label:has(input:checked) { background: var(--ink); border-color: var(--ink); color: #fff; font-weight: 600; }
  .seg label:has(input:focus-visible) { outline: 3px solid var(--focus); outline-offset: 2px; }

  .bottom { position: fixed; left: 0; right: 0; bottom: 0; padding: 12px 20px calc(12px + env(safe-area-inset-bottom)); background: var(--paper); border-top: 1px solid var(--rule); }
  .bottom > div { max-width: 520px; margin: 0 auto; }
  .primary { display: block; width: 100%; min-height: 54px; border: 0; border-radius: 8px; background: var(--ink); color: #fff; font-weight: 650; font-size: 18px; cursor: pointer; }
  .primary:disabled { background: var(--wash); color: var(--ink-2); cursor: default; }
  .err { color: var(--brick); font-weight: 550; margin: 8px 0 0; font-size: 15px; }

  .intro { padding-top: 40px; }
  .intro h1 { font-size: 38px; line-height: 1.05; margin-bottom: 16px; font-variation-settings: "opsz" 96; }
  .intro p { color: var(--ink-2); font-size: 18px; margin: 0 0 12px; max-width: 32ch; }
  .note { font-size: 15px; color: var(--ink-2); margin: 0 0 4px; }
  .live { color: var(--teal); font-weight: 600; }
  .results { margin-top: 18px; }
  .all-q { padding: 24px 0 6px; border-top: 1px solid var(--rule); margin-top: 22px; }
  .all-q h2 { font-size: 19px; line-height: 1.25; margin: 0 0 14px; }
  .offline { position: fixed; left: 50%; bottom: 96px; transform: translateX(-50%); background: var(--ink); color: #fff; padding: 8px 14px; border-radius: 6px; font-size: 14px; }
</style>
</head>
<body>
<main id="app"></main>
<div class="offline" id="offline" hidden>Reconnecting</div>

<script src="/questions.js"></script>
<script src="/static/shared.js"></script>
<script>
/*
  Each student goes through the questions at their own pace:
  intro -> question (with countdown) -> that question's live results -> next question ... -> all results.
  Progress is kept in localStorage per session, so a reload picks up where they were.
*/
const app = document.getElementById("app");
let live = null;                 // latest results from the server
let session = null;
let answered = new Set();        // answered on the server, this session
let prog = { skipped: [], started: {}, began: false };
let view = null, cur = 0, stopClock = null;

const key = () => "phd-survey:" + session;
const save = () => { try { localStorage.setItem(key(), JSON.stringify(prog)); } catch {} };
const load = () => { try { return JSON.parse(localStorage.getItem(key())) || null; } catch { return null; } };
const done = (q) => answered.has(q.id) || prog.skipped.includes(q.id);
const nextIndex = () => QUESTIONS.findIndex((q) => !done(q));

async function boot() {
  const j = await (await fetch("/api/me", { cache: "no-store" })).json();
  session = j.session;
  answered = new Set(j.answered);
  prog = { skipped: [], started: {}, began: false, ...(load() || {}) };
  const n = nextIndex();
  if (n === -1) showAll();
  else if (!prog.began && !answered.size) showIntro();
  else showQuestion(n);
}

function clear() { if (stopClock) { stopClock(); stopClock = null; } window.scrollTo(0, 0); }

function showIntro() {
  clear(); view = "intro";
  app.innerHTML = `<section class="intro"><h1>Let us work together</h1>` +
    `<p>${["Zero","One","Two","Three","Four","Five","Six"][QUESTIONS.length] || QUESTIONS.length} quick questions about your PhD goals. You have ${TIME_LIMIT} seconds for each one.</p>` +
    `<p>After each answer you'll see how everyone has voted so far, live.</p>` +
    `<p class="note">Anonymous. No names or emails are collected.</p></section>` +
    `<div class="bottom"><div><button class="primary" id="go">Start</button></div></div>`;
  document.getElementById("go").onclick = () => { prog.began = true; save(); showQuestion(0); };
}

function showQuestion(i) {
  clear(); view = "ask"; cur = i;
  const q = QUESTIONS[i];
  if (!prog.started[q.id]) { prog.started[q.id] = Date.now(); prog.began = true; save(); }
  const endsAt = prog.started[q.id] + TIME_LIMIT * 1000;
  if (Date.now() >= endsAt) return timeUp(i);

  let h = `<div class="top"><p class="step">Question ${i + 1} of ${QUESTIONS.length}</p>` +
    `<div class="clock" id="clock"><div class="clock-track"><div class="clock-fill"></div></div><div class="clock-num"></div></div></div>` +
    `<h1>${esc(q.title)}</h1><p class="hint">${esc(q.hint)}</p><form id="form" class="${q.type}" novalidate>`;
  if (q.type === "matrix") {
    for (const r of q.rows) {
      h += `<div class="mrow" role="radiogroup" aria-label="${esc(r.label)}"><div>${esc(r.label)}</div><div class="seg">`;
      for (const o of q.options) h += `<label><input type="radio" name="${r.id}" value="${o.id}">${esc(o.label)}</label>`;
      h += `</div></div>`;
    }
  } else {
    const type = q.type === "single" ? "radio" : "checkbox";
    for (const o of q.options) {
      h += `<label class="opt"><input type="${type}" name="a" value="${o.id}"><span class="mark"></span><span>${esc(o.label)}</span></label>`;
      if (o.id === q.otherId) h += `<input class="other" id="other" maxlength="200" placeholder="What path? (optional)" aria-label="Other path" hidden>`;
    }
  }
  h += `</form><div class="bottom"><div><button class="primary" id="send" disabled>Choose an answer</button><p class="err" id="err" hidden></p></div></div>`;
  app.innerHTML = h;

  const form = document.getElementById("form"), send = document.getElementById("send"), err = document.getElementById("err"), other = document.getElementById("other");
  const sync = () => {
    const a = readAnswer(q, form);
    send.disabled = !a;
    if (a) send.textContent = "Send answer";
    else if (q.type === "matrix") {
      const n = q.rows.filter((r) => form.querySelector(`input[name="${r.id}"]:checked`)).length;
      send.textContent = `Answer all ${q.rows.length} areas (${n} of ${q.rows.length})`;
    } else send.textContent = q.type === "multi" ? "Choose at least one" : "Choose an answer";
    if (other) other.hidden = !form.querySelector(`input[value="${q.otherId}"]:checked`);
  };
  form.addEventListener("change", sync);
  send.onclick = async () => {
    const a = readAnswer(q, form);
    if (!a) return;
    send.disabled = true; send.textContent = "Sending"; err.hidden = true;
    try {
      const r = await fetch("/api/answer", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ question: q.id, answer: a }) });
      const j = await r.json();
      if (!j.ok) throw new Error(j.error);
      answered.add(q.id);
      showResult(i, false);
    } catch (e) {
      err.textContent = e.message || "Your answer wasn't sent. Check your connection and try again.";
      err.hidden = false; sync();
    }
  };
  stopClock = runClock(document.getElementById("clock"), { duration: TIME_LIMIT, endsAt, onTimeUp: () => timeUp(i) });
}

function timeUp(i) {
  const q = QUESTIONS[i];
  if (!answered.has(q.id) && !prog.skipped.includes(q.id)) { prog.skipped.push(q.id); save(); }
  showResult(i, true);
}

function readAnswer(q, form) {
  if (q.type === "single") {
    const el = form.querySelector("input[name=a]:checked");
    if (!el) return null;
    const a = { choice: el.value };
    if (el.value === q.otherId) a.other = document.getElementById("other").value;
    return a;
  }
  if (q.type === "multi") {
    const v = [...form.querySelectorAll("input[name=a]:checked")].map((e) => e.value);
    return v.length ? { choices: v } : null;
  }
  const rows = {};
  for (const r of q.rows) {
    const el = form.querySelector(`input[name="${r.id}"]:checked`);
    if (el) rows[r.id] = el.value;
  }
  return Object.keys(rows).length === q.rows.length ? { rows } : null;
}

function countLine(d) {
  return `${answerNoun(d ? d.n : 0)} so far. <span class="live">Updating live.</span>`;
}

function showResult(i, timedOut) {
  clear(); view = "result"; cur = i;
  const q = QUESTIONS[i], n = nextIndex();
  app.innerHTML = `<p class="step" style="margin-top:4px">Question ${i + 1} of ${QUESTIONS.length}</p><h1>${esc(q.title)}</h1>` +
    (timedOut ? `<p class="note" style="color:var(--brick)">Time ran out, so this one was skipped.</p>` : "") +
    `<p class="note" id="count">${countLine(live && live.results[q.id])}</p><div class="results" id="res"></div>` +
    `<div class="bottom"><div><button class="primary" id="next">${n === -1 ? "See all results" : "Next question"}</button></div></div>`;
  if (live) showResults(document.getElementById("res"), q, live.results[q.id]);
  document.getElementById("next").onclick = () => (n === -1 ? showAll() : showQuestion(n));
}

function showAll() {
  clear(); view = "all";
  app.innerHTML = `<section class="intro" style="padding-top:12px"><h1>Thank you.</h1><p>Here's how everyone has answered so far. <span class="live">Updating live.</span></p></section>` +
    QUESTIONS.map((q) => `<section class="all-q"><h2>${esc(q.title)}</h2><p class="note" data-count="${q.id}"></p><div class="results" data-res="${q.id}"></div></section>`).join("");
  refreshLive();
}

// Apply incoming live numbers to whatever results are on screen.
function refreshLive() {
  if (!live) return;
  if (view === "result") {
    const q = QUESTIONS[cur];
    document.getElementById("count").innerHTML = countLine(live.results[q.id]);
    showResults(document.getElementById("res"), q, live.results[q.id]);
  } else if (view === "all") {
    for (const q of QUESTIONS) {
      app.querySelector(`[data-count="${q.id}"]`).textContent = answerNoun(live.results[q.id].n);
      showResults(app.querySelector(`[data-res="${q.id}"]`), q, live.results[q.id]);
    }
  }
}

boot().then(() => {
  connectLive((d) => {
    // A new session was started by the organisers: begin again.
    if (session && d.session !== session) { live = d; return boot(); }
    live = d; refreshLive();
  }, (ok) => (document.getElementById("offline").hidden = ok));
}).catch(() => { app.innerHTML = `<section class="intro"><h1>Can't connect.</h1><p>Check your internet connection, then reload this page.</p></section>`; });
</script>
</body>
</html>
