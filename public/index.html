<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#ffffff">
<title>Let us work together</title>
<link rel="stylesheet" href="/static/base.css">
<style>
  main { max-width: 560px; margin: 0 auto; padding: 18px 20px 130px; min-height: 100svh; }
  .step { color: var(--ink-2); font-size: 15px; margin: 0 0 8px; }
  h1 { font-size: 27px; line-height: 1.18; font-weight: 700; letter-spacing: -0.012em; margin: 6px 0 6px; font-variation-settings: "opsz" 48; }
  .hint { color: var(--ink-2); margin: 0 0 20px; font-size: 15px; }

  .opt { position: relative; display: flex; align-items: center; gap: 14px; padding: 14px 16px; margin-bottom: 8px; min-height: 54px;
    border: 1.5px solid var(--rule); border-radius: 8px; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  .opt input { position: absolute; opacity: 0; pointer-events: none; }
  .mark { flex: 0 0 22px; height: 22px; border: 2px solid var(--ink-2); display: grid; place-items: center; background: var(--paper); }
  .single .mark { border-radius: 50%; }
  .multi .mark { border-radius: 4px; }
  .opt:has(input:checked) { border-color: var(--teal); background: var(--teal-soft); }
  .opt:has(input:checked) .mark { border-color: var(--teal); background: var(--teal); }
  .single .opt:has(input:checked) .mark::after { content: ""; width: 8px; height: 8px; border-radius: 50%; background: #fff; }
  .multi .opt:has(input:checked) .mark::after { content: ""; width: 6px; height: 11px; border: solid #fff; border-width: 0 2.5px 2.5px 0; transform: translateY(-1px) rotate(45deg); }
  .opt:has(input:focus-visible) { outline: 3px solid var(--focus); outline-offset: 2px; }
  .other { width: 100%; margin: 0 0 8px; padding: 13px 16px; font: inherit; border: 1.5px solid var(--rule); border-radius: 8px; background: var(--wash); color: var(--ink); }
  .other:focus { outline: none; border-color: var(--teal); background: var(--paper); }

  .mrow { margin-bottom: 18px; }
  .mrow > div:first-child { font-weight: 600; margin-bottom: 8px; }
  .seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .seg label { position: relative; display: grid; place-items: center; min-height: 50px; border: 1.5px solid var(--rule); border-radius: 8px; cursor: pointer; font-weight: 500; -webkit-tap-highlight-color: transparent; }
  .seg input { position: absolute; opacity: 0; pointer-events: none; }
  .seg label:has(input:checked) { background: var(--ink); border-color: var(--ink); color: #fff; font-weight: 600; }
  .seg label:has(input:focus-visible) { outline: 3px solid var(--focus); outline-offset: 2px; }

  .bottom { position: fixed; left: 0; right: 0; bottom: 0; padding: 12px 20px calc(12px + env(safe-area-inset-bottom)); background: var(--paper); border-top: 1px solid var(--rule); }
  .bottom > div { max-width: 520px; margin: 0 auto; }
  .primary { display: block; width: 100%; min-height: 54px; border: 0; border-radius: 8px; background: var(--ink); color: #fff; font-weight: 650; font-size: 18px; cursor: pointer; }
  .primary:disabled { background: var(--wash); color: var(--ink-2); cursor: default; }
  .err { color: var(--brick); font-weight: 550; margin: 8px 0 0; font-size: 15px; }

  .intro { padding-top: 40px; }
  .intro h1 { font-size: 38px; line-height: 1.05; margin-bottom: 16px; font-variation-settings: "opsz" 96; }
  .intro p { color: var(--ink-2); font-size: 18px; margin: 0 0 12px; max-width: 32ch; }
  .note { font-size: 15px; color: var(--ink-2); margin: 0 0 4px; }
  .sent { width: 56px; height: 56px; border-radius: 50%; background: var(--teal); display: grid; place-items: center; margin-bottom: 24px; }
  .sent svg { width: 28px; height: 28px; }
  .offline { position: fixed; left: 50%; bottom: 96px; transform: translateX(-50%); background: var(--ink); color: #fff; padding: 8px 14px; border-radius: 6px; font-size: 14px; }
</style>
</head>
<body>
<main id="app"></main>
<div class="offline" id="offline" hidden>Reconnecting</div>

<script src="/questions.js"></script>
<script src="/static/shared.js"></script>
<script>
/*
  The admin decides which question is on. This page shows only that question.
  Once a student answers, it points them to the projector for the results.
*/
const app = document.getElementById("app");
let data = null, session = null, answered = new Set(), viewKey = "";

async function loadMine() {
  try {
    const j = await (await fetch("/api/me", { cache: "no-store" })).json();
    session = j.session; answered = new Set(j.answered);
  } catch {}
}

function render(force) {
  if (!data) return;
  const s = data.state;
  if (session && s.session !== session) { session = s.session; answered = new Set(); }
  const q = s.summary ? null : QUESTIONS[s.q];
  const view = s.summary ? "end" : !q ? "wait" : answered.has(q.id) ? "sent" : "ask";
  const key = [s.session, view, s.q].join("|");
  if (key === viewKey && !force) return;
  viewKey = key;
  window.scrollTo(0, 0);

  if (view === "wait") {
    app.innerHTML = `<section class="intro"><h1>Let us work together</h1><p>You're in. The first question will appear here when it starts.</p>` +
      `<p class="note">Anonymous. No names or emails are collected.</p></section>`;
  } else if (view === "ask") {
    app.innerHTML = `<p class="step" style="margin-top:4px">Question ${s.q + 1} of ${QUESTIONS.length}</p>` + questionForm(q);
    wireForm(q);
  } else if (view === "sent") {
    app.innerHTML = `<section class="intro"><div class="sent"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>` +
      `<h1>Look at the screen.</h1><p>Your answer is in. The results are showing up there now.</p><p class="note">The next question will appear here on its own.</p></section>`;
  } else {
    app.innerHTML = `<section class="intro"><h1>Thank you.</h1><p>That was the last question. The full results are on the screen.</p></section>`;
  }
}

function questionForm(q) {
  let h = `<h1>${esc(q.title)}</h1><p class="hint">${esc(q.hint)}</p><form id="form" class="${q.type}" novalidate>`;
  if (q.type === "matrix") {
    for (const r of q.rows) {
      h += `<div class="mrow" role="radiogroup" aria-label="${esc(r.label)}"><div>${esc(r.label)}</div><div class="seg">`;
      for (const o of q.options) h += `<label><input type="radio" name="${r.id}" value="${o.id}">${esc(o.label)}</label>`;
      h += `</div></div>`;
    }
  } else {
    const type = q.type === "single" ? "radio" : "checkbox";
    for (const o of q.options) {
      h += `<label class="opt"><input type="${type}" name="a" value="${o.id}"><span class="mark"></span><span>${esc(o.label)}</span></label>`;
      if (o.id === q.otherId) h += `<input class="other" id="other" maxlength="200" placeholder="What path? (optional)" aria-label="Other path" hidden>`;
    }
  }
  return h + `</form><div class="bottom"><div><button class="primary" id="send" disabled>Choose an answer</button><p class="err" id="err" hidden></p></div></div>`;
}

function readAnswer(q, form) {
  if (q.type === "single") {
    const el = form.querySelector("input[name=a]:checked");
    if (!el) return null;
    const a = { choice: el.value };
    if (el.value === q.otherId) a.other = document.getElementById("other").value;
    return a;
  }
  if (q.type === "multi") {
    const v = [...form.querySelectorAll("input[name=a]:checked")].map((e) => e.value);
    return v.length ? { choices: v } : null;
  }
  const rows = {};
  for (const r of q.rows) {
    const el = form.querySelector(`input[name="${r.id}"]:checked`);
    if (el) rows[r.id] = el.value;
  }
  return Object.keys(rows).length === q.rows.length ? { rows } : null;
}

function wireForm(q) {
  const form = document.getElementById("form"), send = document.getElementById("send"), err = document.getElementById("err"), other = document.getElementById("other");
  const sync = () => {
    const a = readAnswer(q, form);
    send.disabled = !a;
    if (a) send.textContent = "Send answer";
    else if (q.type === "matrix") {
      const n = q.rows.filter((r) => form.querySelector(`input[name="${r.id}"]:checked`)).length;
      send.textContent = `Answer all ${q.rows.length} areas (${n} of ${q.rows.length})`;
    } else send.textContent = q.type === "multi" ? "Choose at least one" : "Choose an answer";
    if (other) other.hidden = !form.querySelector(`input[value="${q.otherId}"]:checked`);
  };
  form.addEventListener("change", sync);
  send.onclick = async () => {
    const a = readAnswer(q, form);
    if (!a) return;
    send.disabled = true; send.textContent = "Sending"; err.hidden = true;
    try {
      const r = await fetch("/api/answer", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ question: q.id, answer: a }) });
      const j = await r.json();
      if (!j.ok) throw new Error(j.error);
      answered.add(q.id);
      render(true);
    } catch (e) {
      err.textContent = e.message || "Your answer wasn't sent. Check your connection and try again.";
      err.hidden = false; sync();
    }
  };
}

loadMine().then(() => {
  connectLive("phone", (d) => {
    const changed = session && d.state.session !== session;
    data = d;
    if (changed) loadMine().then(() => render(true)); else render();
  }, (ok) => (document.getElementById("offline").hidden = ok));
});
</script>
</body>
</html>
