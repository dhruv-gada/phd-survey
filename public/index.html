<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#ffffff">
<title>PhD student survey</title>
<link rel="stylesheet" href="/static/base.css">
<style>
  main { max-width: 560px; margin: 0 auto; padding: 18px 20px 120px; min-height: 100svh; }
  .top { position: sticky; top: 0; z-index: 2; background: var(--paper); padding: 14px 0 12px; margin: -18px 0 8px; }
  .step { color: var(--ink-2); font-size: 15px; margin-bottom: 8px; display: flex; justify-content: space-between; }
  h1 { font-size: 27px; line-height: 1.18; font-weight: 700; letter-spacing: -0.012em; margin: 6px 0 6px; font-variation-settings: "opsz" 48; }
  .hint { color: var(--ink-2); margin: 0 0 20px; font-size: 15px; }

  .opt { position: relative; display: flex; align-items: center; gap: 14px; padding: 14px 16px; margin-bottom: 8px; min-height: 54px;
    border: 1.5px solid var(--rule); border-radius: 8px; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  .opt input { position: absolute; opacity: 0; pointer-events: none; }
  .mark { flex: 0 0 22px; height: 22px; border: 2px solid var(--ink-2); display: grid; place-items: center; background: var(--paper); }
  .single .mark { border-radius: 50%; }
  .multi .mark { border-radius: 4px; }
  .opt:has(input:checked) { border-color: var(--teal); background: var(--teal-soft); }
  .opt:has(input:checked) .mark { border-color: var(--teal); background: var(--teal); }
  .single .opt:has(input:checked) .mark::after { content: ""; width: 8px; height: 8px; border-radius: 50%; background: #fff; }
  .multi .opt:has(input:checked) .mark::after { content: ""; width: 6px; height: 11px; border: solid #fff; border-width: 0 2.5px 2.5px 0; transform: translateY(-1px) rotate(45deg); }
  .opt:has(input:focus-visible) { outline: 3px solid var(--focus); outline-offset: 2px; }
  .other { width: 100%; margin: 0 0 8px; padding: 13px 16px; font: inherit; border: 1.5px solid var(--rule); border-radius: 8px; background: var(--wash); color: var(--ink); }
  .other:focus { outline: none; border-color: var(--teal); background: var(--paper); }

  .mrow { margin-bottom: 18px; }
  .mrow > div:first-child { font-weight: 600; margin-bottom: 8px; }
  .seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .seg label { position: relative; display: grid; place-items: center; min-height: 50px; border: 1.5px solid var(--rule); border-radius: 8px; cursor: pointer; font-weight: 500; -webkit-tap-highlight-color: transparent; }
  .seg input { position: absolute; opacity: 0; pointer-events: none; }
  .seg label:has(input:checked) { background: var(--ink); border-color: var(--ink); color: #fff; font-weight: 600; }
  .seg label:has(input:focus-visible) { outline: 3px solid var(--focus); outline-offset: 2px; }

  .send-bar { position: fixed; left: 0; right: 0; bottom: 0; padding: 12px 20px calc(12px + env(safe-area-inset-bottom)); background: var(--paper); border-top: 1px solid var(--rule); }
  .send-bar > div { max-width: 520px; margin: 0 auto; }
  .send { display: block; width: 100%; min-height: 54px; border: 0; border-radius: 8px; background: var(--ink); color: #fff; font-weight: 650; font-size: 18px; cursor: pointer; }
  .send:disabled { background: var(--wash); color: var(--ink-2); cursor: default; }
  .err { color: var(--brick); font-weight: 550; margin: 8px 0 0; font-size: 15px; }

  .notice { padding: 56px 0 0; }
  .notice h1 { font-size: 34px; margin-bottom: 10px; }
  .notice p { color: var(--ink-2); margin: 0 0 8px; font-size: 18px; max-width: 32ch; }
  .sent-mark { width: 52px; height: 52px; border-radius: 50%; background: var(--teal); display: grid; place-items: center; margin-bottom: 22px; }
  .sent-mark svg { width: 26px; height: 26px; }
  .results { margin-top: 22px; }
  .tag { display: inline-block; color: var(--ink-2); font-size: 15px; margin: 0 0 4px; }
  .end-q { padding: 26px 0 8px; border-top: 1px solid var(--rule); margin-top: 26px; }
  .end-q h2 { font-size: 19px; line-height: 1.25; margin: 0 0 14px; }

  .offline { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: var(--ink); color: #fff; padding: 8px 14px; border-radius: 6px; font-size: 14px; }
</style>
</head>
<body>
<main id="app" aria-live="polite"></main>
<div class="offline" id="offline" hidden>Reconnecting</div>

<script src="/questions.js"></script>
<script src="/static/shared.js"></script>
<script>
const app = document.getElementById("app");
let data = null;          // latest payload from the server
let mine = new Set();     // question ids this phone has answered in this session
let mineSession = null;
let viewKey = "";
let stopClock = null;
const clockState = {};

async function loadMine() {
  try {
    const j = await (await fetch("/api/me", { cache: "no-store" })).json();
    mine = new Set(j.answered); mineSession = j.session;
  } catch {}
}

function header(qi, withClock) {
  return `<div class="top"><div class="step"><span>Question ${qi + 1} of ${QUESTIONS.length}</span></div>` +
    (withClock ? `<div class="clock" id="clock"><div class="clock-track"><div class="clock-fill"></div></div><div class="clock-num"></div></div>` : "") +
    `</div>`;
}

function questionForm(q) {
  let h = `<h1>${esc(q.title)}</h1><p class="hint">${esc(q.hint)}</p><form id="form" class="${q.type}" novalidate>`;
  if (q.type === "matrix") {
    for (const r of q.rows) {
      h += `<div class="mrow" role="radiogroup" aria-label="${esc(r.label)}"><div>${esc(r.label)}</div><div class="seg">`;
      for (const o of q.options) h += `<label><input type="radio" name="${r.id}" value="${o.id}">${esc(o.label)}</label>`;
      h += `</div></div>`;
    }
  } else {
    const type = q.type === "single" ? "radio" : "checkbox";
    for (const o of q.options) {
      h += `<label class="opt"><input type="${type}" name="a" value="${o.id}"><span class="mark"></span><span>${esc(o.label)}</span></label>`;
      if (o.id === q.otherId) h += `<input class="other" id="other" maxlength="200" placeholder="What path? (optional)" aria-label="Other path" hidden>`;
    }
  }
  h += `</form><div class="send-bar"><div><button class="send" id="send" type="button" disabled>Choose an answer</button><p class="err" id="err" hidden></p></div></div>`;
  return h;
}

function readAnswer(q, form) {
  if (q.type === "single") {
    const el = form.querySelector("input[name=a]:checked");
    if (!el) return null;
    const a = { choice: el.value };
    if (el.value === q.otherId) a.other = document.getElementById("other").value;
    return a;
  }
  if (q.type === "multi") {
    const v = [...form.querySelectorAll("input[name=a]:checked")].map((e) => e.value);
    return v.length ? { choices: v } : null;
  }
  const rows = {};
  for (const r of q.rows) {
    const el = form.querySelector(`input[name="${r.id}"]:checked`);
    if (el) rows[r.id] = el.value;
  }
  return Object.keys(rows).length === q.rows.length ? { rows } : null;
}

function wireForm(q) {
  const form = document.getElementById("form");
  const send = document.getElementById("send");
  const err = document.getElementById("err");
  const other = document.getElementById("other");
  const sync = () => {
    const a = readAnswer(q, form);
    send.disabled = !a;
    if (a) send.textContent = "Send answer";
    else if (q.type === "matrix") {
      const done = q.rows.filter((r) => form.querySelector(`input[name="${r.id}"]:checked`)).length;
      send.textContent = `Answer all ${q.rows.length} areas (${done} of ${q.rows.length})`;
    } else send.textContent = q.type === "multi" ? "Choose at least one" : "Choose an answer";
    if (other) other.hidden = !form.querySelector(`input[value="${q.otherId}"]:checked`);
  };
  form.addEventListener("change", sync);
  send.addEventListener("click", async () => {
    const a = readAnswer(q, form);
    if (!a) return;
    send.disabled = true; send.textContent = "Sending"; err.hidden = true;
    try {
      const r = await fetch("/api/answer", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ question: q.id, answer: a }) });
      const j = await r.json();
      if (!j.ok) throw new Error(j.error);
      mine.add(q.id);
      render(true);
    } catch (e) {
      err.textContent = e.message || "Your answer was not sent. Check your connection and try again.";
      err.hidden = false;
      sync();
    }
  });
}

function render(force) {
  if (!data) return;
  const s = data.state;
  if (s.session !== mineSession) { mineSession = s.session; mine = new Set(); loadMine().then(() => render(true)); }
  const q = QUESTIONS[s.q];
  const answered = q && mine.has(q.id);
  const timeLeft = s.endsAt ? s.endsAt - serverNow() : 0;
  let view = s.phase;
  if (s.phase === "open") view = answered ? "sent" : timeLeft <= 0 ? "timeup" : "ask";
  // Only results views depend on incoming numbers; others redraw only when the view itself changes.
  const key = [s.session, view, s.q, view === "closed" || view === "ended" ? JSON.stringify(data.results) : ""].join("|");
  Object.assign(clockState, s);
  if (key === viewKey && !force) return;
  viewKey = key;
  if (stopClock) { stopClock(); stopClock = null; }

  if (view === "lobby") {
    app.innerHTML = `<section class="notice"><h1>You're in.</h1><p>Questions appear here one at a time once the session starts. Keep this page open.</p><p>No names or emails are collected.</p></section>`;
  } else if (view === "ask") {
    app.innerHTML = header(s.q, true) + questionForm(q);
    wireForm(q);
  } else if (view === "sent" || view === "timeup") {
    app.innerHTML = header(s.q, true) + `<section class="notice" style="padding-top:28px">` +
      (view === "sent"
        ? `<div class="sent-mark"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div><h1>Answer sent.</h1><p>Results show here when time runs out.</p>`
        : `<h1>Time's up.</h1><p>Results show here in a moment.</p>`) + `</section>`;
  } else if (view === "closed") {
    app.innerHTML = header(s.q, false) +
      `<h1>${esc(q.title)}</h1><p class="hint">${answerNoun(data.results[q.id].n)}${answered ? "" : ". You didn't answer this one."}</p>` +
      `<div class="results" id="res">${resultsHTML(q, data.results[q.id])}</div>` +
      `<p class="hint" style="margin-top:28px">${s.q < QUESTIONS.length - 1 ? "The next question will appear here." : "That was the last question."}</p>`;
    growBars(app);
  } else if (view === "ended") {
    app.innerHTML = `<section class="notice" style="padding-top:28px"><h1>Thank you.</h1><p>Here's how everyone answered.</p></section>` +
      QUESTIONS.map((x) => `<section class="end-q"><h2>${esc(x.title)}</h2>${resultsHTML(x, data.results[x.id])}</section>`).join("");
    growBars(app);
  }

  const clock = document.getElementById("clock");
  if (clock && s.phase === "open") {
    stopClock = runClock(clock, clockState);
    clock.addEventListener("timeup", () => { if (view === "ask") render(true); });
  }
}

loadMine().then(() => {
  connectLive("phone", (d) => { data = d; render(); }, (ok) => (document.getElementById("offline").hidden = ok));
});
</script>
</body>
</html>
