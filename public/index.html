<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Let us work together · PhD student survey</title>
<style>
  :root {
    --bg: #f6f5f1; --card: #ffffff; --ink: #1b1b19; --muted: #5d5c57; --line: #e2e0d8;
    --accent: #2a78d6; --accent-ink: #ffffff; --accent-soft: #e6f0fc; --error: #c43b3b;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #141413; --card: #1f1f1d; --ink: #f0efec; --muted: #b5b4ab; --line: #34342f;
      --accent: #3987e5; --accent-soft: #1d2e44; --error: #e66767; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
    font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; -webkit-text-size-adjust: 100%; }
  main { max-width: 560px; margin: 0 auto; padding: 28px 16px 64px; }
  header h1 { font-size: 28px; line-height: 1.15; margin: 0 0 6px; letter-spacing: -0.01em; }
  header p { margin: 0 0 22px; color: var(--muted); }
  .badge { display: inline-flex; gap: 6px; align-items: center; font-size: 13px; color: var(--muted);
    background: var(--card); border: 1px solid var(--line); border-radius: 999px; padding: 4px 10px; margin-bottom: 14px; }
  fieldset { border: 1px solid var(--line); background: var(--card); border-radius: 14px; margin: 0 0 14px; padding: 18px 16px 14px; }
  legend { float: left; width: 100%; padding: 0; margin-bottom: 4px; font-weight: 650; font-size: 17px; line-height: 1.3; }
  legend .num { color: var(--accent); margin-right: 4px; }
  .hint { clear: both; color: var(--muted); font-size: 14px; margin: 0 0 12px; }
  .opt { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border: 1.5px solid var(--line);
    border-radius: 10px; margin-bottom: 8px; cursor: pointer; user-select: none; transition: border-color .12s, background .12s; min-height: 48px; }
  .opt input { position: absolute; opacity: 0; pointer-events: none; }
  .opt .mark { flex: 0 0 20px; height: 20px; border: 2px solid var(--muted); display: grid; place-items: center; }
  .opt.radio .mark { border-radius: 50%; }
  .opt.check .mark { border-radius: 5px; }
  .opt:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); }
  .opt:has(input:checked) .mark { border-color: var(--accent); background: var(--accent); }
  .opt.radio:has(input:checked) .mark::after { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--accent-ink); }
  .opt.check:has(input:checked) .mark::after { content: ""; width: 5px; height: 10px; border: solid var(--accent-ink);
    border-width: 0 2.5px 2.5px 0; transform: translateY(-1px) rotate(45deg); }
  .opt:has(input:focus-visible) { outline: 2px solid var(--accent); outline-offset: 2px; }
  .other-text { width: 100%; margin: 2px 0 8px; padding: 12px 14px; font: inherit; color: var(--ink); background: var(--bg);
    border: 1.5px solid var(--line); border-radius: 10px; }
  .other-text:focus { outline: none; border-color: var(--accent); }
  .mrow { padding: 10px 0; border-top: 1px solid var(--line); }
  .mrow:first-of-type { border-top: 0; padding-top: 0; }
  .mrow .rl { font-weight: 550; margin-bottom: 8px; }
  .seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .seg label { position: relative; text-align: center; padding: 11px 6px; border: 1.5px solid var(--line); border-radius: 10px;
    cursor: pointer; font-weight: 550; min-height: 46px; display: grid; place-items: center; }
  .seg input { position: absolute; opacity: 0; pointer-events: none; }
  .seg label:has(input:checked) { border-color: var(--accent); background: var(--accent); color: var(--accent-ink); }
  .seg label:has(input:focus-visible) { outline: 2px solid var(--accent); outline-offset: 2px; }
  button.primary { width: 100%; padding: 15px; font: inherit; font-weight: 650; font-size: 17px; border: 0; border-radius: 12px;
    background: var(--accent); color: var(--accent-ink); cursor: pointer; margin-top: 6px; }
  button.primary:disabled { opacity: .6; cursor: default; }
  .error { color: var(--error); font-weight: 550; min-height: 1.4em; margin: 10px 2px 0; }
  .done { text-align: center; padding: 48px 12px; }
  .done .tick { width: 64px; height: 64px; border-radius: 50%; background: var(--accent); margin: 0 auto 18px; display: grid; place-items: center; }
  .done h2 { margin: 0 0 8px; font-size: 24px; }
  .done p { color: var(--muted); margin: 0 0 22px; }
  a.link { color: var(--accent); font-weight: 600; }
  .ghost { background: none; border: 0; color: var(--muted); font: inherit; text-decoration: underline; cursor: pointer; margin-top: 14px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <header>
    <div class="badge"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>Anonymous · no names or emails collected</div>
    <h1>Let us work together</h1>
    <p>Four quick questions about your PhD goals. About one minute.</p>
  </header>

  <form id="form" novalidate></form>

  <section id="done" class="done" hidden>
    <div class="tick"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>
    <h2>Thank you!</h2>
    <p>Your answers were recorded anonymously.</p>
    <a class="link" href="/results">See live results →</a><br>
    <button class="ghost" id="again" type="button">Submit another response</button>
  </section>
</main>

<script src="/questions.js"></script>
<script>
const form = document.getElementById("form");
const done = document.getElementById("done");
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function render() {
  let html = "";
  QUESTIONS.forEach((q, i) => {
    html += `<fieldset><legend><span class="num">${i + 1}.</span>${esc(q.title)}</legend><p class="hint">${esc(q.hint)}</p>`;
    if (q.type === "single" || q.type === "multi") {
      const t = q.type === "single" ? "radio" : "checkbox";
      for (const o of q.options) {
        html += `<label class="opt ${q.type === "single" ? "radio" : "check"}"><input type="${t}" name="${q.id}" value="${o.id}"><span class="mark"></span><span>${esc(o.label)}</span></label>`;
        if (q.otherId === o.id) html += `<input class="other-text" id="${q.id}_other" maxlength="200" placeholder="Tell us more (optional)" hidden>`;
      }
    } else if (q.type === "matrix") {
      for (const r of q.rows) {
        html += `<div class="mrow"><div class="rl">${esc(r.label)}</div><div class="seg">`;
        for (const o of q.options) html += `<label><input type="radio" name="${q.id}.${r.id}" value="${o.id}">${esc(o.label)}</label>`;
        html += `</div></div>`;
      }
    }
    html += `</fieldset>`;
  });
  html += `<button class="primary" type="submit">Submit anonymously</button><p class="error" id="err" role="alert"></p>`;
  form.innerHTML = html;

  for (const q of QUESTIONS) {
    if (!q.otherId) continue;
    const box = document.getElementById(q.id + "_other");
    form.querySelectorAll(`input[name="${q.id}"]`).forEach((el) =>
      el.addEventListener("change", () => {
        box.hidden = !(el.value === q.otherId && el.checked);
        if (!box.hidden) box.focus();
      })
    );
  }
}

function collect() {
  const body = {};
  for (const q of QUESTIONS) {
    if (q.type === "single") {
      const el = form.querySelector(`input[name="${q.id}"]:checked`);
      if (el) body[q.id] = el.value;
      if (q.otherId && body[q.id] === q.otherId) body[q.id + "_other"] = document.getElementById(q.id + "_other").value;
    } else if (q.type === "multi") {
      const v = [...form.querySelectorAll(`input[name="${q.id}"]:checked`)].map((e) => e.value);
      if (v.length) body[q.id] = v;
    } else if (q.type === "matrix") {
      const m = {};
      for (const r of q.rows) {
        const el = form.querySelector(`input[name="${q.id}.${r.id}"]:checked`);
        if (el) m[r.id] = el.value;
      }
      if (Object.keys(m).length) body[q.id] = m;
    }
  }
  return body;
}

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  const err = document.getElementById("err");
  const btn = form.querySelector("button.primary");
  const body = collect();
  if (!Object.keys(body).length) { err.textContent = "Please answer at least one question."; return; }
  err.textContent = "";
  btn.disabled = true; btn.textContent = "Submitting…";
  try {
    const r = await fetch("/api/submit", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
    const j = await r.json();
    if (!j.ok) throw new Error(j.error || "Something went wrong.");
    try { localStorage.setItem("phd-survey-done", "1"); } catch {}
    showDone();
  } catch (x) {
    err.textContent = x.message || "Network error. Please try again.";
  } finally {
    btn.disabled = false; btn.textContent = "Submit anonymously";
  }
});

function showDone() { form.hidden = true; done.hidden = false; window.scrollTo(0, 0); }
document.getElementById("again").addEventListener("click", () => {
  try { localStorage.removeItem("phd-survey-done"); } catch {}
  render(); form.hidden = false; done.hidden = true; window.scrollTo(0, 0);
});

render();
try { if (localStorage.getItem("phd-survey-done")) showDone(); } catch {}
</script>
</body>
</html>
