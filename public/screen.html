<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Live results</title>
<link rel="stylesheet" href="/static/base.css">
<style>
  body { font-size: clamp(16px, 1.25vw, 24px); overflow-x: hidden; }
  .stage { min-height: 100vh; padding: 3.2vw 4vw 3vw; display: grid; grid-template-columns: 1fr auto; grid-template-rows: auto 1fr auto;
    grid-template-areas: "clock side" "main side" "count side"; column-gap: 5vw; }
  .stage > .clock { grid-area: clock; margin-bottom: 2.6vw; }
  .stage > .main { grid-area: main; min-width: 0; }
  .clock-track { height: 1.1vw; min-height: 10px; border-radius: 0.55vw; }
  .clock-num { font-size: 2.4em; line-height: 1; min-width: 2.6ch; }
  .step { color: var(--ink-2); font-size: 1.15em; margin: 0 0 0.6em; }
  h1 { font-weight: 700; letter-spacing: -0.02em; line-height: 1.08; margin: 0; font-variation-settings: "opsz" 96; }
  .q-title { font-size: clamp(32px, 3.6vw, 76px); max-width: 26ch; margin-bottom: 1.1em; }
  .side { grid-area: side; align-self: start; text-align: center; width: clamp(140px, 13vw, 260px); }
  .qr { background: #fff; }
  .qr img { display: block; width: 100%; height: auto; }
  .side p { margin: 0.8em 0 0; font-size: 0.95em; color: var(--ink-2); line-height: 1.3; }
  .side b { color: var(--ink); font-weight: 650; }

  .choices { list-style: none; margin: 0; padding: 0; columns: 2; column-gap: 3vw; max-width: 64vw; }
  .choices li { break-inside: avoid; font-size: 1.3em; padding: 0.45em 0 0.45em 1.1em; position: relative; }
  .choices li::before { content: ""; position: absolute; left: 0; top: 1.05em; width: 0.45em; height: 0.45em; border-radius: 50%; background: var(--teal); }
  .count { grid-area: count; align-self: end; display: flex; align-items: baseline; gap: 0.4em; margin-top: 2vw; }
  .count b { font-size: 4.2em; line-height: 0.9; font-weight: 750; font-variant-numeric: tabular-nums; }
  .count span { font-size: 1.3em; color: var(--ink-2); }

  .results { max-width: 64vw; font-size: 1.25em; }
  .results .res-row { margin-bottom: 0.9em; }
  .results .res-track { height: 1.15em; }
  .results .stack { height: 2.2em; }

  /* lobby */
  .lobby { min-height: 100vh; display: grid; grid-template-columns: 1.15fr 1fr; align-items: center; gap: 6vw; padding: 5vw 6vw; }
  .lobby h1 { font-size: clamp(44px, 6.4vw, 140px); margin-bottom: 0.25em; }
  .lobby .lede { font-size: 1.6em; color: var(--ink-2); margin: 0 0 1.6em; max-width: 26ch; line-height: 1.3; }
  .lobby .url { font-size: 1.5em; font-weight: 650; word-break: break-all; }
  .lobby .phones { margin-top: 2.2em; font-size: 1.25em; color: var(--ink-2); }
  .lobby .phones b { color: var(--ink); font-variant-numeric: tabular-nums; }
  .lobby .qr { justify-self: end; width: min(38vw, 72vh); }

  /* final summary */
  .summary { padding: 3vw 4vw; }
  .summary > header { display: flex; justify-content: space-between; align-items: end; gap: 3vw; margin-bottom: 2.4vw; }
  .summary > header h1 { font-size: clamp(30px, 3vw, 64px); }
  .summary > header p { margin: 0; color: var(--ink-2); font-size: 1.15em; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 3vw 5vw; }
  .grid h2 { font-size: 1.2em; line-height: 1.25; margin: 0 0 0.9em; font-weight: 700; max-width: 34ch; }
  .grid h2 small { display: block; font-weight: 400; color: var(--ink-2); font-size: 0.78em; margin-top: 0.25em; }

  .offline { position: fixed; right: 16px; bottom: 14px; color: var(--ink-2); font-size: 14px; }
  @media (max-width: 800px) {
    .stage { grid-template-columns: 1fr; grid-template-areas: "clock" "main" "count"; } .side { display: none; }
    .lobby { grid-template-columns: 1fr; } .lobby .qr { justify-self: start; width: 70vw; }
    .grid { grid-template-columns: 1fr; } .choices { columns: 1; } .results, .choices { max-width: none; }
  }
</style>
</head>
<body>
<div id="app"></div>
<div class="offline" id="offline" hidden>Reconnecting</div>

<script src="/questions.js"></script>
<script src="/static/shared.js"></script>
<script>
const app = document.getElementById("app");
let url = location.host;
let data = null, viewKey = "", stopClock = null;
const clockState = {};
fetch("/api/url").then((r) => r.json()).then((j) => { url = j.url.replace(/^https?:\/\//, "").replace(/\/$/, ""); render(true); });

const qr = (cls = "") => `<div class="qr ${cls}"><img src="/qr.svg" alt="QR code that opens the survey"></div>`;
const side = () => `<aside class="side">${qr()}<p>Scan to answer<br><b>${esc(url)}</b></p></aside>`;

function render(force) {
  if (!data) return;
  const s = data.state, q = QUESTIONS[s.q];
  Object.assign(clockState, s);
  const key = [s.session, s.phase, s.q, url, s.phase === "open" ? "" : JSON.stringify(data.results), s.phase === "lobby" ? data.phones : ""].join("|");

  // While a question is open, only the answer count changes; update it in place.
  const live = document.getElementById("answered");
  if (live) live.textContent = data.answered;
  const liveNoun = document.getElementById("answered-noun");
  if (liveNoun) liveNoun.textContent = data.answered === 1 ? "answer" : "answers";
  if (key === viewKey && !force) return;
  viewKey = key;
  if (stopClock) { stopClock(); stopClock = null; }

  if (s.phase === "lobby") {
    app.innerHTML = `<section class="lobby"><div><h1>Let us work together</h1>` +
      `<p class="lede">Four questions about your PhD goals, answered anonymously from your phone.</p>` +
      `<div class="url">${esc(url)}</div>` +
      `<p class="phones"><b>${data.phones}</b> ${data.phones === 1 ? "phone has" : "phones have"} joined</p></div>${qr()}</section>`;
  } else if (s.phase === "open") {
    app.innerHTML = `<section class="stage"><div class="clock" id="clock"><div class="clock-track"><div class="clock-fill"></div></div><div class="clock-num"></div></div>` +
      `<div class="main"><p class="step">Question ${s.q + 1} of ${QUESTIONS.length}</p><h1 class="q-title">${esc(q.title)}</h1>` +
      (q.type === "matrix"
        ? `<ul class="choices">${q.rows.map((r) => `<li>${esc(r.label)}</li>`).join("")}</ul><p class="step" style="margin-top:1em">${q.options.map((o) => esc(o.label)).join(", ")} for each</p>`
        : `<ul class="choices">${q.options.map((o) => `<li>${esc(o.label)}</li>`).join("")}</ul>`) +
      `</div>${side()}<div class="count"><b id="answered">${data.answered}</b><span id="answered-noun">${data.answered === 1 ? "answer" : "answers"}</span></div></section>`;
    stopClock = runClock(document.getElementById("clock"), clockState);
  } else if (s.phase === "closed") {
    const d = data.results[q.id];
    app.innerHTML = `<section class="stage" style="grid-template-areas:'main side' 'main side' 'main side'"><div class="main"><p class="step">Question ${s.q + 1} of ${QUESTIONS.length}, ${answerNoun(d.n)}</p>` +
      `<h1 class="q-title" style="font-size:clamp(28px,2.8vw,60px)">${esc(q.title)}</h1><div class="results">${resultsHTML(q, d)}</div></div>${side()}</section>`;
    growBars(app);
  } else if (s.phase === "ended") {
    const people = Math.max(0, ...QUESTIONS.map((x) => data.results[x.id].n));
    app.innerHTML = `<section class="summary"><header><h1>How the room answered</h1><p>${people} ${people === 1 ? "person" : "people"} took part</p></header><div class="grid">` +
      QUESTIONS.map((x) => `<section><h2>${esc(x.title)}<small>${answerNoun(data.results[x.id].n)}</small></h2>${resultsHTML(x, data.results[x.id])}</section>`).join("") +
      `</div></section>`;
    growBars(app);
  }
}

connectLive("screen", (d) => { data = d; render(); }, (ok) => (document.getElementById("offline").hidden = ok));
</script>
</body>
</html>
