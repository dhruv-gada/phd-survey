<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Live results · Let us work together</title>
<link rel="stylesheet" href="/static/base.css">
<style>
  body { font-size: clamp(15px, 1.05vw, 22px); }
  .page { display: grid; grid-template-columns: clamp(200px, 19vw, 360px) 1fr; gap: 4vw; padding: 3vw 3.5vw; min-height: 100vh; }
  aside { position: sticky; top: 3vw; align-self: start; }
  aside h1 { font-size: clamp(30px, 2.8vw, 60px); line-height: 1.02; letter-spacing: -0.02em; margin: 0 0 0.9em; font-variation-settings: "opsz" 96; }
  .qr { background: #fff; }
  .qr img { display: block; width: 100%; height: auto; }
  .scan { margin: 0.9em 0 0; color: var(--ink-2); line-height: 1.35; }
  .scan b { display: block; color: var(--ink); font-size: 1.1em; word-break: break-all; }
  .total { margin-top: 2.2em; }
  .total b { display: block; font-size: 4.4em; line-height: 0.95; font-weight: 750; font-variant-numeric: tabular-nums; }
  .total span { color: var(--ink-2); }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 3vw 4vw; align-content: start; }
  .grid h2 { font-size: 1.25em; line-height: 1.25; margin: 0 0 0.3em; max-width: 34ch; }
  .grid .n { color: var(--ink-2); margin: 0 0 1em; font-size: 0.95em; }
  .offline { position: fixed; right: 16px; bottom: 14px; color: var(--ink-2); font-size: 14px; }
  @media (max-width: 900px) { .page { grid-template-columns: 1fr; } aside { position: static; max-width: 320px; } .grid { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="page">
  <aside>
    <h1>Let us work together</h1>
    <div class="qr"><img src="/qr.svg" alt="QR code that opens the survey"></div>
    <p class="scan">Scan to answer, or go to<b id="url"></b></p>
    <p class="total"><b id="total">0</b><span id="totalNoun">people have answered</span></p>
  </aside>
  <main class="grid" id="grid"></main>
</div>
<div class="offline" id="offline" hidden>Reconnecting</div>

<script src="/questions.js"></script>
<script src="/static/shared.js"></script>
<script>
const grid = document.getElementById("grid");
fetch("/api/url").then((r) => r.json()).then((j) => (document.getElementById("url").textContent = j.url.replace(/^https?:\/\//, "").replace(/\/$/, "")));
grid.innerHTML = QUESTIONS.map((q) => `<section><h2>${esc(q.title)}</h2><p class="n" data-n="${q.id}"></p><div data-res="${q.id}"></div></section>`).join("");

connectLive((d) => {
  const people = Math.max(0, ...QUESTIONS.map((q) => d.results[q.id].n));
  document.getElementById("total").textContent = people;
  document.getElementById("totalNoun").textContent = people === 1 ? "person has answered" : "people have answered";
  for (const q of QUESTIONS) {
    grid.querySelector(`[data-n="${q.id}"]`).textContent = answerNoun(d.results[q.id].n);
    showResults(grid.querySelector(`[data-res="${q.id}"]`), q, d.results[q.id]);
  }
}, (ok) => (document.getElementById("offline").hidden = ok));
</script>
</body>
</html>
